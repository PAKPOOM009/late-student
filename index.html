<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกนักเรียนมาสาย | โรงเรียนเทศบาล ๔ (เพาะชำ)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif}:root{--g:#08783f;--o:#f58220;--r:#d63031;--bg:#f4f6f5}body{background:var(--bg);color:#222}#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--g) 50%,var(--o) 50%)}.login-box,.section,.stat-card{background:#fff;border-radius:18px;box-shadow:0 3px 15px #0001}.login-box{width:100%;max-width:430px;padding:35px 30px;text-align:center}.school-logo,.header-logo{object-fit:contain}.school-logo{width:130px;height:130px}.login-box h1,header h1,.section h2{color:var(--g)}.login-box p{color:#777;margin:8px 0 25px}.input-group,.form-group{margin-bottom:15px;text-align:left}.input-group label,.form-group label{display:block;font-weight:bold;margin-bottom:6px}input{width:100%;padding:13px;border:2px solid #ddd;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:15px}.login-btn,.green-btn{background:var(--g);color:#fff}.orange-btn,.logout-btn{background:var(--o);color:#fff}.red-btn{background:var(--r);color:#fff}#error{color:var(--r);margin-top:15px;min-height:20px}#app{display:none}header{background:#fff;border-bottom:5px solid var(--o);padding:12px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}.header-left{display:flex;align-items:center;gap:12px}.header-logo{width:65px;height:65px}header p{color:#777;font-size:13px}.container{width:92%;max-width:1250px;margin:25px auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-bottom:25px}.stat-card{padding:18px;border-left:6px solid var(--g)}.stat-card.orange{border-color:var(--o)}.stat-card.red{border-color:var(--r)}.stat-card h3{font-size:14px;color:#777;margin-bottom:8px}.stat-card strong{color:var(--g);font-size:30px}.section{padding:25px;margin-bottom:25px}.section h2{margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}.student-list{max-height:400px;overflow:auto;border:1px solid #eee;border-radius:12px}.student{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:15px;cursor:pointer}.student:hover,.student.selected{background:#e8f5ed}.student.selected{border-left:6px solid var(--g)}.student-name,.history-name{font-weight:bold;font-size:17px}.student-info,.history-info{color:#777;font-size:14px;margin-top:5px}.student-actions{display:flex;gap:7px}.small-btn{padding:8px 12px;font-size:13px}.history-item{padding:16px;border-bottom:1px solid #eee}.history-name{color:var(--g);margin-bottom:8px}.ranking{display:grid;gap:10px}.rank-item{display:flex;justify-content:space-between;background:#f8f8f8;padding:14px;border-radius:10px}.rank-number{font-size:20px;font-weight:bold;color:var(--o)}.chart-container{overflow:auto}canvas{width:100%;min-height:280px}.empty{padding:25px;text-align:center;color:#888}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){header h1{font-size:15px}.header-logo{width:48px;height:48px}.container{width:94%;margin:15px auto}.section{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.student{flex-direction:column}.student-actions{width:100%}.small-btn{flex:1}}
</style>
</head>
<body>
<div id="loginPage"><div class="login-box"><img src="S__2580482.jpg" class="school-logo" alt="โลโก้โรงเรียน"><h1>ระบบบันทึกนักเรียนมาสาย</h1><p>โรงเรียนเทศบาล ๔ (เพาะชำ)</p><div class="input-group"><label>ชื่อผู้ใช้งาน</label><input id="username" placeholder="กรอกชื่อผู้ใช้งาน"></div><div class="input-group"><label>รหัสผ่าน</label><input id="password" type="password" placeholder="กรอกรหัสผ่าน"></div><button class="login-btn" onclick="login()">🔐 เข้าสู่ระบบ</button><div id="error"></div></div></div>
<div id="app"><header><div class="header-left"><img src="S__2580482.jpg" class="header-logo" alt="โลโก้โรงเรียน"><div><h1>ระบบบันทึกนักเรียนมาสาย</h1><p>โรงเรียนเทศบาล ๔ (เพาะชำ)</p></div></div><button class="logout-btn" onclick="logout()">ออกจากระบบ</button></header><main class="container"><div class="stats"><div class="stat-card"><h3>👨‍🎓 นักเรียนทั้งหมด</h3><strong id="totalStudents">0</strong></div><div class="stat-card orange"><h3>📅 มาสายวันนี้</h3><strong id="todayLate">0</strong></div><div class="stat-card"><h3>📆 สัปดาห์นี้</h3><strong id="weekLate">0</strong></div><div class="stat-card orange"><h3>🗓️ เดือนนี้</h3><strong id="monthLate">0</strong></div><div class="stat-card red"><h3>⚠️ มาสายทั้งหมด</h3><strong id="totalLate">0</strong></div></div>
<section class="section"><h2>➕ เพิ่มนักเรียน</h2><div class="form-grid"><div class="form-group"><label>รหัสนักเรียน</label><input id="newId"></div><div class="form-group"><label>ห้อง</label><input id="newRoom"></div><div class="form-group"><label>ชื่อนักเรียน</label><input id="newName"></div><div class="form-group"><label>ระดับชั้น</label><input id="newGrade"></div><div class="form-group full"><label>หมายเหตุ</label><input id="newNote"></div><button class="green-btn full" onclick="addStudent()">เพิ่มนักเรียน</button></div></section>
<section class="section"><h2>📚 รายชื่อนักเรียน</h2><input id="search" placeholder="ค้นหาชื่อ / ห้อง / รหัส" oninput="render()"><div id="students" class="student-list"></div></section>
<section class="section"><h2>📝 บันทึกมาสาย</h2><div class="form-grid"><div class="form-group"><label>นักเรียนที่เลือก</label><input id="selected" readonly></div><div class="form-group"><label>วันที่</label><input id="date" type="date"></div><div class="form-group"><label>เวลา</label><input id="time" type="time"></div><div class="form-group full"><label>สาเหตุ</label><input id="reason" placeholder="เช่น รถติด"></div><button class="orange-btn full" onclick="record()">บันทึกการมาสาย</button></div></section>
<section class="section"><h2>🏆 อันดับการมาสาย</h2><div id="ranking" class="ranking"></div></section><section class="section"><h2>🕘 ประวัติการมาสาย</h2><div id="history"></div></section></main></div>
<script>
const key='lateStudents',initial=[['001','นางสาวปรียา ใจดี','6/1','ป.6'],['002','นายกิตติพงษ์ รักเรียน','6/2','ป.6'],['003','นางสาวพรทิพย์ แก้วมณี','5/1','ป.5'],['004','นายธีรภัทร มั่นคง','5/2','ป.5']].map(([id,name,room,grade])=>({id,name,room,grade,history:[]}));let students=JSON.parse(localStorage.getItem(key))||initial,selected=null;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(students));
function login(){if($('username').value==='admin'&&$('password').value==='1234'){$('loginPage').style.display='none';$('app').style.display='block';$('date').valueAsDate=new Date();$('time').value=new Date().toTimeString().slice(0,5);render()}else $('error').textContent='ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง'}function logout(){location.reload()}
function addStudent(){let id=$('newId').value.trim(),name=$('newName').value.trim(),room=$('newRoom').value.trim(),grade=$('newGrade').value.trim();if(!id||!name||!room||!grade)return alert('กรุณากรอกข้อมูลให้ครบถ้วน');if(students.some(s=>s.id===id))return alert('มีรหัสนักเรียนนี้อยู่แล้ว');students.push({id,name,room,grade,history:[]});save();render();['newId','newName','newRoom','newGrade','newNote'].forEach(id=>$(id).value='')}
function choose(id){selected=id;$('selected').value=students.find(s=>s.id===id).name;render()}function removeStudent(id){if(confirm('ต้องการลบนักเรียนหรือไม่?')){students=students.filter(s=>s.id!==id);selected=null;save();render()}}function record(){let s=students.find(x=>x.id===selected);if(!s)return alert('กรุณาเลือกนักเรียนก่อนบันทึก');s.history.push({date:$('date').value,time:$('time').value,reason:$('reason').value||'ไม่ระบุสาเหตุ'});save();$('reason').value='';render()}
function render(){let q=($('search')?.value||'').toLowerCase(),list=students.filter(s=>(s.name+s.id+s.room).toLowerCase().includes(q));$('students').innerHTML=list.map(s=>`<div class="student ${s.id===selected?'selected':''}"><div><div class="student-name">${s.name}</div><div class="student-info">รหัส: ${s.id} · ห้อง: ${s.room} · ชั้น: ${s.grade}</div></div><div class="student-actions"><button class="small-btn green-btn" onclick="choose('${s.id}')">เลือก</button><button class="small-btn red-btn" onclick="removeStudent('${s.id}')">ลบ</button></div></div>`).join('')||'<div class="empty">ไม่พบนักเรียน</div>';let all=students.flatMap(s=>s.history.map(h=>({...h,name:s.name,room:s.room}))),today=new Date().toISOString().slice(0,10);$('totalStudents').textContent=students.length;$('todayLate').textContent=all.filter(x=>x.date===today).length;$('totalLate').textContent=all.length;$('weekLate').textContent=all.length;$('monthLate').textContent=all.length;let rank=[...students].sort((a,b)=>b.history.length-a.history.length).filter(s=>s.history.length);$('ranking').innerHTML=rank.length?rank.map((s,i)=>`<div class="rank-item"><span><b class="rank-number">#${i+1}</b> ${s.name}</span><b>${s.history.length} ครั้ง</b></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูลการมาสาย</div>';$('history').innerHTML=all.reverse().map(x=>`<div class="history-item"><div class="history-name">${x.name}</div><div class="history-info">ห้อง ${x.room}<br>วันที่: ${x.date} · เวลา: ${x.time}<br>สาเหตุ: ${x.reason}</div></div>`).join('')||'<div class="empty">ยังไม่มีประวัติการมาสาย</div>'}
</script></body></html>
